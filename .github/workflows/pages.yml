# site/ をそのまま GitHub Pages へ上げる。ビルドはしない（素の HTML/CSS/JS なので）。
#
# 使うには、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1 本ずつ。走っている途中のものは止めない（途中で切ると中途半端に載る）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
